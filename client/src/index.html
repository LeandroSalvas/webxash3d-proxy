<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Espectador CS</title>
    <script>
        // Keep the engine main loop alive while the tab is hidden.
        // Browsers pause requestAnimationFrame for hidden tabs, which freezes the
        // Xash3D game loop and lets the netchan time out (frozen screen on refocus).
        // Fall back to a timer when hidden so the loop keeps ticking (~1fps).
        (function () {
            var realRaf = window.requestAnimationFrame.bind(window);
            var realCaf = window.cancelAnimationFrame.bind(window);
            window.requestAnimationFrame = function (cb) {
                if (document.hidden) {
                    return window.setTimeout(function () {
                        cb(performance.now());
                    }, 16);
                }
                return realRaf(cb);
            };
            window.cancelAnimationFrame = function (id) {
                if (document.hidden) {
                    return window.clearTimeout(id);
                }
                return realCaf(id);
            };
        })();
    </script>
    <script>
        // No mic: this is a spectator-only client, it never transmits voice. The
        // Xash3D engine glue requests microphone access on startup (SDL2/AL
        // capture) which triggers a browser permission prompt. Reject it up front
        // so the engine's onError path (which only records the error) falls back
        // to silence — no prompt, no user confusion.
        (function () {
            var md = navigator.mediaDevices;
            if (md && md.getUserMedia) {
                var realGetUserMedia = md.getUserMedia.bind(md);
                md.getUserMedia = function (constraints) {
                    if (constraints && (constraints.audio || constraints.video)) {
                        return Promise.reject(new Error('captura desabilitada (espectador)'));
                    }
                    return realGetUserMedia(constraints);
                };
            }
        })();
    </script>
    <script type="module" src="/main.ts"></script>

    <style>
        body {
            background-color: #120d0b;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .notDraggable {
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        @keyframes pulsate {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0.85);
                opacity: 0.7;
            }
        }

        @keyframes indeterminate {
            0% {
                background-position: 100% 0;
            }
            100% {
                background-position: -100% 0;
            }
        }

        canvas {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background-color: #120d0b;
            transition: opacity 0.5s ease-in-out;
        }

        #loading.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #logo {
            width: 128px;
            height: 128px;
            animation-name: pulsate;
            animation-duration: 0.75s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        #stage {
            color: #e7e5e4;
            font-size: 16px;
            letter-spacing: 0.03em;
            margin: 0;
            text-align: center;
        }

        #barTrack {
            width: min(340px, 70vw);
            height: 8px;
            border-radius: 999px;
            background-color: #261d19;
            overflow: hidden;
        }

        #barFill {
            width: 0;
            height: 100%;
            border-radius: 999px;
            background-color: #fb923c;
            transition: width 0.2s ease-in-out;
        }

        #barFill.indeterminate {
            width: 100%;
            background-image: linear-gradient(90deg, #fb923c 0%, #f97316 50%, #fb923c 100%);
            background-size: 200% 100%;
            animation: indeterminate 1.2s linear infinite;
        }

        #percent {
            color: #a8a29e;
            font-size: 13px;
            margin: 0;
            font-variant-numeric: tabular-nums;
        }

        #error {
            display: none;
            color: #f87171;
            font-size: 14px;
            line-height: 1.4;
            max-width: min(420px, 80vw);
            text-align: center;
            margin: 0;
            white-space: pre-wrap;
        }

        #loading.error #barFill {
            background-color: #f87171;
            background-image: none;
            animation: none;
            width: 100%;
        }

        form {
            margin: 0;
            padding: 16px;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: white;
        }

        form > div {
            display: flex;
            justify-content: space-between;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="loading">
    <img id="logo" alt="Zueira CS" class="notDraggable" src="/loading.png"/>
    <p id="stage">Carregando…</p>
    <div id="barTrack">
        <div id="barFill"></div>
    </div>
    <p id="percent">0%</p>
    <p id="error" class="notDraggable"></p>
</div>

<form id="form">
    <div>
        <label>
            Touch controls
            <input type="checkbox" id="touchControls">
        </label>
    </div>
</form>
</body>
</html>
